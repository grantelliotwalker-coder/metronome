<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metronome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7edf0; --panel:#f6f9fa; --ink:#18262e; --muted:#5d6f79; --line:#c5d1d7;
  --brass:#a87414; --brass-ink:#ffffff; --accent-beat:#a87414; --beat:#18262e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121d25; --panel:#1b2a34; --ink:#e8eff2; --muted:#93a6b0; --line:#2f4350;
    --brass:#e0a93f; --brass-ink:#1a1405; --accent-beat:#e0a93f; --beat:#e8eff2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121d25; --panel:#1b2a34; --ink:#e8eff2; --muted:#93a6b0; --line:#2f4350;
  --brass:#e0a93f; --brass-ink:#1a1405; --accent-beat:#e0a93f; --beat:#e8eff2; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:20px 20px 32px;display:flex;flex-direction:column;gap:18px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:28px 28px 14px 14px;padding:14px 12px 4px;position:relative}
svg.pendulum{display:block;width:100%;height:auto;max-height:46vh;margin:0 auto}
.body-fill{fill:var(--ink)}
.arm{stroke:var(--brass);stroke-width:3;stroke-linecap:round}
.weight{fill:var(--brass)}
.tick{stroke:var(--panel);stroke-width:1.5;opacity:.5}
#swing{transform-origin:100px 232px}

.readout{display:flex;align-items:center;justify-content:center;gap:14px}
.bpm{text-align:center;min-width:160px}
.bpm output{display:block;font-size:92px;font-weight:700;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bpm span{display:block;color:var(--muted);font-size:17px;margin-top:4px}
.step{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-size:28px;line-height:1;display:grid;place-items:center;user-select:none;touch-action:manipulation}
.step:active{background:var(--line)}

input[type=range]{width:100%;accent-color:var(--brass);height:32px;margin:0}

.beats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;min-height:26px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:background .06s,transform .06s,border-color .06s}
.dot.first{border-color:var(--accent-beat)}
.dot.on{background:var(--beat);border-color:var(--beat);transform:scale(1.25)}
.dot.first.on{background:var(--accent-beat);border-color:var(--accent-beat)}

.go{height:68px;border-radius:34px;border:0;background:var(--brass);color:var(--brass-ink);font-size:22px;font-weight:700;touch-action:manipulation}
.go[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--muted)}
.field select,.tap{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:0 12px}
.tap{font-weight:600;touch-action:manipulation}
.tap:active{background:var(--line)}
.vol{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<main>
  <section class="stage" aria-hidden="true">
    <svg class="pendulum" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
      <g id="swing">
        <line class="arm" x1="100" y1="232" x2="100" y2="34"/>
        <rect id="weight" class="weight" x="88" y="110" width="24" height="22" rx="4"/>
      </g>
      <path class="body-fill" d="M52 256 L74 70 Q100 52 126 70 L148 256 Z" opacity=".0"/>
      <path class="body-fill" d="M40 258 L66 178 Q100 160 134 178 L160 258 Z"/>
      <line class="tick" x1="78" y1="205" x2="122" y2="205"/>
      <line class="tick" x1="74" y1="222" x2="126" y2="222"/>
      <circle cx="100" cy="232" r="7" fill="#a87414"/>
    </svg>
  </section>

  <section class="readout" aria-label="Tempo">
    <button class="step" id="minus" aria-label="Slower by 1 BPM">−</button>
    <div class="bpm"><output id="bpmOut" aria-live="polite">100</output><span id="mark">Andante</span></div>
    <button class="step" id="plus" aria-label="Faster by 1 BPM">+</button>
  </section>

  <input type="range" id="slider" min="30" max="240" value="100" aria-label="Tempo in beats per minute">

  <div class="beats" id="beats" aria-hidden="true"></div>

  <button class="go" id="go" aria-pressed="false">Start</button>

  <div class="row">
    <label class="field">Beats per bar
      <select id="bpb"></select>
    </label>
    <label class="field">Subdivision
      <select id="sub">
        <option value="1">None</option>
        <option value="2">Eighths</option>
        <option value="3">Triplets</option>
        <option value="4">Sixteenths</option>
      </select>
    </label>
  </div>

  <div class="row">
    <button class="tap" id="tap">Tap tempo</button>
    <label class="vol">Volume
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </label>
  </div>

  <p class="hint">Space starts and stops. Arrow keys change tempo.</p>
</main>

<script>
(function(){
  var bpm=100, beatsPerBar=4, subdiv=1, playing=false;
  var ctx=null, master=null, timer=null, nextTime=0, beatIdx=0, subIdx=0;
  var queue=[], last={time:0,idx:0,dur:0.6}, raf=null;

  var $=function(id){return document.getElementById(id)};
  var out=$('bpmOut'), mark=$('mark'), slider=$('slider'), go=$('go'), beatsEl=$('beats'),
      swing=$('swing'), weight=$('weight');

  var marks=[[40,'Grave'],[60,'Largo'],[66,'Larghetto'],[76,'Adagio'],[108,'Andante'],[120,'Moderato'],[156,'Allegro'],[176,'Vivace'],[200,'Presto'],[999,'Prestissimo']];
  function markFor(b){for(var i=0;i<marks.length;i++){if(b<marks[i][0])return marks[i][1]}return 'Prestissimo'}

  var bpb=$('bpb');
  for(var n=1;n<=12;n++){var o=document.createElement('option');o.value=n;o.textContent=n;if(n===4)o.selected=true;bpb.appendChild(o)}

  function buildDots(){
    beatsEl.innerHTML='';
    for(var i=0;i<beatsPerBar;i++){var d=document.createElement('div');d.className='dot'+(i===0?' first':'');beatsEl.appendChild(d)}
  }

  function setBpm(v){
    bpm=Math.max(30,Math.min(240,Math.round(v)));
    out.textContent=bpm; slider.value=bpm; mark.textContent=markFor(bpm);
    // Weight rides higher on the arm at slow tempos, as on a real metronome
    var y=48+(bpm-30)/210*130;
    weight.setAttribute('y',y.toFixed(1));
  }

  function click(time,kind){
    var osc=ctx.createOscillator(), g=ctx.createGain();
    var f=kind==='accent'?1650:kind==='beat'?1100:760;
    var peak=kind==='sub'?0.35:1;
    osc.type='square'; osc.frequency.value=f;
    g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(peak,time+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    osc.connect(g); g.connect(master);
    osc.start(time); osc.stop(time+0.06);
  }

  function schedule(){
    while(nextTime<ctx.currentTime+0.12){
      var dur=60/bpm;
      if(subIdx===0){
        click(nextTime, beatIdx===0?'accent':'beat');
        queue.push({time:nextTime,idx:beatIdx,dur:dur});
      }else{
        click(nextTime,'sub');
      }
      nextTime+=dur/subdiv;
      subIdx++;
      if(subIdx>=subdiv){subIdx=0;beatIdx=(beatIdx+1)%beatsPerBar}
    }
  }

  function draw(){
    if(!ctx){return}
    var now=ctx.currentTime;
    while(queue.length&&queue[0].time<=now){
      last=queue.shift();
      var dots=beatsEl.children;
      for(var i=0;i<dots.length;i++)dots[i].classList.toggle('on',i===last.idx);
    }
    var frac=Math.min(1,Math.max(0,(now-last.time)/last.dur));
    // The arm reaches an extreme on every click and alternates side each beat
    var side=(last.count||0)%2===0?1:-1;
    var angle=22*side*Math.cos(Math.PI*frac);
    swing.style.transform='rotate('+angle.toFixed(2)+'deg)';
    raf=requestAnimationFrame(draw);
  }

  var beatCounter=0;
  var origPush=queue.push;

  function start(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext;
      ctx=new AC(); master=ctx.createGain(); master.connect(ctx.destination);
      setVol();
    }
    if(ctx.state==='suspended')ctx.resume();
    playing=true; beatIdx=0; subIdx=0; beatCounter=0; queue=[];
    nextTime=ctx.currentTime+0.06;
    last={time:nextTime,idx:0,dur:60/bpm,count:0};
    go.textContent='Stop'; go.setAttribute('aria-pressed','true');
    timer=setInterval(schedule,25); schedule();
    cancelAnimationFrame(raf); draw();
  }

  function stop(){
    playing=false; clearInterval(timer); cancelAnimationFrame(raf);
    queue=[]; go.textContent='Start'; go.setAttribute('aria-pressed','false');
    swing.style.transform='rotate(0deg)';
    var dots=beatsEl.children;
    for(var i=0;i<dots.length;i++)dots[i].classList.remove('on');
  }

  // Track absolute beat count so the swing direction stays consistent
  var _schedule=schedule;
  schedule=function(){
    var before=queue.length;
    _schedule();
    for(var i=before;i<queue.length;i++){queue[i].count=beatCounter++}
  };
  var _shift=Array.prototype.shift;

  function setVol(){
    if(master){var v=$('vol').value/100;master.gain.value=v*v}
  }

  function toggle(){playing?stop():start()}

  go.addEventListener('click',toggle);
  $('minus').addEventListener('click',function(){setBpm(bpm-1)});
  $('plus').addEventListener('click',function(){setBpm(bpm+1)});
  slider.addEventListener('input',function(){setBpm(+slider.value)});
  $('vol').addEventListener('input',setVol);
  bpb.addEventListener('change',function(){
    beatsPerBar=+bpb.value; buildDots(); beatIdx=0; subIdx=0;
  });
  $('sub').addEventListener('change',function(){subdiv=+$('sub').value; subIdx=0});

  var taps=[];
  $('tap').addEventListener('click',function(){
    var t=performance.now();
    if(taps.length&&t-taps[taps.length-1]>2000)taps=[];
    taps.push(t); if(taps.length>6)taps.shift();
    if(taps.length>=2){
      var sum=0;for(var i=1;i<taps.length;i++)sum+=taps[i]-taps[i-1];
      setBpm(60000/(sum/(taps.length-1)));
    }
  });

  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(e.code==='Space'&&tag!=='button'&&tag!=='select'){e.preventDefault();toggle()}
    else if(e.key==='ArrowUp'&&tag!=='input'&&tag!=='select'){e.preventDefault();setBpm(bpm+(e.shiftKey?10:1))}
    else if(e.key==='ArrowDown'&&tag!=='input'&&tag!=='select'){e.preventDefault();setBpm(bpm-(e.shiftKey?10:1))}
  });

  buildDots(); setBpm(100);
})();
</script>
</body>
</html>
